services:
  db:
    image: postgres:17-alpine
    container_name: voiceagent-db
    environment:
      POSTGRES_DB: voiceagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vA_Db_SecurePassword_2026!
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d voiceagent" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: fhjibon/voiceagent-backend:latest
    container_name: voiceagent-backend
    env_file:
      - ./Backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_WS_URL=wss://apiform.optovex.com/ws
    image: fhjibon/voiceagent-frontend:latest
    container_name: voiceagent-frontend
    env_file:
      - ./Frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
